# Audit Rayonnages ASTO — fabrication automatique de l'application Android (APK).
# À chaque modification de index.html ou du dossier android/, GitHub compile l'application,
# la signe avec la clé du projet et la publie à l'adresse :
# https://github.com/lbrasselet-spec/Audit-Rayonnages-ASTO/releases/download/apk/Audit-Rayonnages-ASTO.apk
# La clé de signature n'est pas dans le dépôt : elle est enregistrée dans le secret GitHub
# AUDIT_KEYSTORE_B64 (Settings > Secrets and variables > Actions). Sans ce secret, l'APK est
# signé avec une clé provisoire et n'est PAS publié (version de contrôle uniquement).
name: Application Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'icon-192.png', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assembler le projet Android
        shell: bash
        run: |
          P=projet
          J=$P/app/src/main/java/fr/brasselet/audit
          R=$P/app/src/main/res
          mkdir -p $J $P/app/src/main/assets/www $R/mipmap-xxxhdpi $R/xml
          cp android/settings.gradle $P/
          cp android/build.gradle $P/app/
          cp android/AndroidManifest.xml $P/app/src/main/
          cp android/MainActivity.java $J/
          cp android/res/xml/file_paths.xml $R/xml/
          cp index.html icon-192.png $P/app/src/main/assets/www/
          cp icon-192.png $R/mipmap-xxxhdpi/ic_launcher.png
          printf 'org.gradle.jvmargs=-Xmx3g\nandroid.useAndroidX=true\n' > $P/gradle.properties

      - name: Clé de signature
        shell: bash
        env:
          CLE: ${{ secrets.AUDIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$CLE" ]; then
            printf '%s' "$CLE" | tr -d ' \r\n' | base64 -d > projet/app/audit.p12
            echo "SIGNATURE=stable" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore projet/app/audit.p12 -storetype PKCS12 -storepass audit-asto -keypass audit-asto -alias audit -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Audit Rayonnages provisoire"
            echo "SIGNATURE=provisoire" >> "$GITHUB_ENV"
            echo "::warning title=Signature provisoire::Secret AUDIT_KEYSTORE_B64 absent : APK de contrôle, non publié."
          fi
          keytool -list -keystore projet/app/audit.p12 -storepass audit-asto -alias audit > /dev/null && echo "Clé lisible." || { echo "::error title=Clé de signature::Le secret AUDIT_KEYSTORE_B64 est illisible : recopiez le texte de la clé en entier."; exit 1; }

      - name: Compiler l'APK
        shell: bash
        working-directory: projet
        env:
          VERSION_CODE: ${{ github.run_number }}
          AUDIT_KEY_PASSWORD: audit-asto
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Erreurs de compilation
        if: failure()
        shell: bash
        run: |
          E=$( { grep -E "error:|warning: \[" projet/build.log | head -25; grep -A 15 "What went wrong" projet/build.log | head -30; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
          echo "::error title=Compilation::$E"
          exit 1

      - name: Préparer l'APK
        shell: bash
        run: cp projet/app/build/outputs/apk/release/app-release.apk Audit-Rayonnages-ASTO.apk

      - name: Publier l'APK
        if: env.SIGNATURE == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Audit Rayonnages ASTO — application Android" --notes "Application Android à installer sur le téléphone."
          gh release upload apk Audit-Rayonnages-ASTO.apk --clobber
          gh release edit apk --notes "Version 1.0.${{ github.run_number }} du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M'). Téléchargez Audit-Rayonnages-ASTO.apk ci-dessous."
          echo "::notice::APK publié (version 1.0.${{ github.run_number }}) : https://github.com/${{ github.repository }}/releases/download/apk/Audit-Rayonnages-ASTO.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Audit-Rayonnages-ASTO.apk

  # Essai automatique sur un téléphone virtuel Android 14 : installation, ouverture,
  # lecture de l'écran. Les résultats s'affichent en notes dans l'exécution.
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Préparer le scénario de test
        run: |
          cat > "$RUNNER_TEMP/essai.sh" <<'FIN'
          P=fr.brasselet.audit
          adb install -r -g Audit-Rayonnages-ASTO.apk || echo "::error::Installation impossible"
          adb logcat -c
          adb shell am start -n $P/.MainActivity
          sleep 25
          adb logcat -d > logcat.txt
          adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb shell cat /sdcard/ui.xml > ui.xml
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          if grep -q "FATAL EXCEPTION" logcat.txt; then
            echo "::error title=Plantage::$(grep -A 25 'FATAL EXCEPTION' logcat.txt | head -40 | enc)"
          fi
          grep -i "chromium.*Uncaught\|chromium.*Error" logcat.txt | head -20 > js.txt
          [ -s js.txt ] && echo "::warning title=Erreurs de la page::$(enc < js.txt)"
          echo "::notice title=Écran::$(grep -o 'text="[^"]*"' ui.xml | sed 's/text="//;s/"$//' | grep -v '^$' | head -40 | enc)"
          FIN

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash "$RUNNER_TEMP/essai.sh"
